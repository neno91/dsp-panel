<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSP Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 9.8V20h13V9.8"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18.5V6l11-2.5V16"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-radio" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M6 9l10-5"/><circle cx="8.5" cy="14.5" r="2.2"/><path d="M14 13h4M14 16h4"/></symbol>
  <symbol id="i-restaurant" viewBox="0 0 24 24"><path d="M6 3v7a2.5 2.5 0 0 0 5 0V3M8.5 3v18M17 3c-2 1-3 4-3 7v2h3v9"/></symbol>
  <symbol id="i-reception" viewBox="0 0 24 24"><path d="M3 20h18M4 20v-6h16v6"/><path d="M8 14V9a4 4 0 0 1 8 0v5"/><circle cx="12" cy="5" r="1.5"/></symbol>
  <symbol id="i-meeting" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5M13.5 15.5c.9-.6 2-.9 3-.9 2.7 0 5 1.8 5 4.4"/></symbol>
  <symbol id="i-office" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4M7 8h4M7 11.5h7"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h12M11 7l5 5-5 5"/><path d="M20 5v14"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7 6.5a7.5 7.5 0 1 0 10 0"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
  <symbol id="i-group" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-xlr" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="8.2" r="1.4"/><circle cx="8.3" cy="14.3" r="1.4"/><circle cx="15.7" cy="14.3" r="1.4"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12.5" rx="1.5"/><path d="M8.5 20.5h7M12 16.5v4"/><path d="M6.5 8h4M6.5 11h7"/></symbol>
</svg>

<div class="backdrop" aria-hidden="true"></div>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.svg" alt="DSP Panel">
    </div>
    <nav class="view-nav" id="view-nav" data-i18n-aria="viewNav" aria-label="Visning"></nav>
    <div class="clock">
      <div>
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date" id="clock-date"></div>
      </div>
      <span class="status" id="conn-status" data-state="">—</span>
    </div>
  </header>

  <section class="view" id="view-zones" aria-labelledby="h-zones">
    <div class="view-head">
      <h1 id="h-zones" data-i18n="zonesTitle">Soner</h1>
      <p data-i18n="zonesLead">Velg kilde og juster volum per sone</p>
    </div>
    <div class="groups" id="groups"></div>
    <div class="zones-grid" id="zones-grid"></div>
  </section>

  <section class="view" id="view-mixer" aria-labelledby="h-mixer">
    <div class="view-head">
      <h1 id="h-mixer" data-i18n="mixerTitle">Mikser</h1>
      <p data-i18n="mixerLead">Inngangsnivå for mikrofoner og musikkilder</p>
    </div>
    <div class="mixer-strip" id="mixer-strip"></div>
  </section>
  <!-- Attribution notice required by the licence (LICENSE §2) – keep visible -->
  <footer class="credits">Powered by DSP Panel · © 2026 Jørgen Skar – Løvold System. All rights reserved.</footer>
</div>

<!-- js/config.js is generated by the bridge from site.json; the copy in the repo is a
     default used only when index.html is opened directly (simulation mode). -->
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/bridge.js"></script>
<script src="js/core.js"></script>
<script src="js/fader.js"></script>
<script src="js/source-groups.js"></script>
<script src="js/groups.js"></script>
<script src="js/app.js"></script>
</body>
</html>
